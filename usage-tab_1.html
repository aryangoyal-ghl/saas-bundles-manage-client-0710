<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage tab — sub-account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* HighRise tokens */
  --primary-25:#f5f8ff;--primary-50:#eff4ff;--primary-100:#d1e0ff;--primary-200:#b2ccff;
  --primary-300:#84adff;--primary-400:#528bff;--primary-500:#2970ff;--primary-600:#155eef;
  --primary-700:#004eeb;--primary-800:#0040c1;--primary-900:#00359e;
  --gray-25:#fcfcfd;--gray-50:#f9fafb;--gray-100:#f2f4f7;--gray-200:#eaecf0;--gray-300:#d0d5dd;
  --gray-400:#98a2b3;--gray-500:#667085;--gray-600:#475467;--gray-700:#344054;--gray-800:#1d2939;--gray-900:#101828;
  --success-25:#f6fef9;--success-50:#ecfdf3;--success-100:#d1fadf;--success-200:#a6f4c5;--success-300:#6ce9a6;
  --success-500:#12b76a;--success-600:#039855;--success-700:#027a48;
  --warning-25:#fffcf5;--warning-50:#fffaeb;--warning-100:#fef0c7;--warning-200:#fedf89;--warning-300:#fec84b;
  --warning-500:#f79009;--warning-600:#dc6803;--warning-700:#b54708;
  --error-25:#fffbfa;--error-50:#fef3f2;--error-100:#fee4e2;--error-200:#fecdca;--error-300:#fda29b;
  --error-500:#f04438;--error-600:#d92d20;--error-700:#b42318;
  --purple-50:#f4f3ff;--purple-100:#ebe9fe;--purple-200:#d9d6fe;--purple-500:#7a5af8;--purple-600:#6938ef;--purple-700:#5925dc;
  --gray-blue-50:#f8f9fc;--gray-blue-100:#eaecf5;--gray-blue-200:#d5d9eb;--gray-blue-600:#3e4784;--gray-blue-700:#363f72;
  --radius-sm:4px;--radius-md:6px;--radius-lg:8px;--radius-xl:12px;--radius-full:9999px;
  --shadow-xs:0px 1px 2px #1018280d;
  --shadow-sm:0px 1px 2px 0px #1018280f,0px 1px 3px 0px #1018281a;
  --shadow-lg:0px 12px 16px -4px #10182814,0px 4px 6px -2px #10182808;
  --focus-ring:0px 0px 0px 4px #d1e0ff;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:14px;line-height:20px;color:var(--gray-900);background:var(--gray-100);-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
a{color:var(--primary-700)}

/* ---------- prototype chrome ---------- */
.proto-bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;
  padding:8px 20px;min-height:52px;background:var(--gray-900);color:#fff;flex-wrap:wrap}
.proto-bar .pb-title{font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.proto-bar .pb-title span{font-weight:400;color:var(--gray-400);margin-left:8px}
.pb-nav{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.pb-nav button{background:transparent;border:0;color:var(--gray-300);font-size:12px;font-weight:500;
  padding:6px 10px;border-radius:var(--radius-md);white-space:nowrap}
.pb-nav button:hover{background:#ffffff1f;color:#fff}
.pb-nav button[aria-current="true"]{background:var(--primary-600);color:#fff}
.pb-sep{width:1px;height:20px;background:#ffffff2e;margin:0 4px}
.pb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pb-notes-btn{background:#ffffff1f;border:0;color:#fff;font-size:12px;font-weight:600;padding:7px 12px;border-radius:var(--radius-md)}
.pb-notes-btn[aria-pressed="true"]{background:var(--warning-300);color:var(--gray-900)}

/* ---------- app chrome ---------- */
.app{max-width:1440px;margin:0 auto;background:var(--gray-50);min-height:calc(100vh - 52px)}
.app-head{background:#fff;border-bottom:1px solid var(--gray-200);padding:20px 32px 0}
.crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--gray-600);margin-bottom:10px}
.crumb svg{width:14px;height:14px}
.acct-row{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.acct-row h1{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.02em}
.acct-row .sub{font-size:13px;color:var(--gray-500);margin-top:2px}
.acct-actions{margin-left:auto;display:flex;gap:8px}
/* HighRise count badge (Badge / Tabs `count`): gray-100 on gray-700, primary-50
   on primary-700 when it belongs to the active tab. */
.hr-count{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;
  min-width:20px;height:20px;padding:0 6px;border-radius:var(--radius-md);
  background:var(--gray-100);color:var(--gray-700);
  font-size:12px;font-weight:500;line-height:20px;font-variant-numeric:tabular-nums}
.hr-count.on{background:var(--primary-50);color:var(--primary-700)}

.tabs{display:flex;gap:12px;overflow-x:auto}
.tabs a{padding:0 4px 12px;font-size:14px;font-weight:600;color:var(--gray-500);text-decoration:none;
  border-bottom:2px solid transparent;white-space:nowrap;
  display:inline-flex;align-items:center;gap:8px}
.tabs a.on{color:var(--primary-700);border-bottom-color:var(--primary-600)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;
  border-radius:var(--radius-lg);font-size:14px;font-weight:600;border:1px solid transparent;
  transition:background .12s ease,border-color .12s ease,box-shadow .12s ease}
.btn svg{width:16px;height:16px;flex:none}
.btn-primary{background:var(--primary-600);color:#fff;border-color:var(--primary-600);box-shadow:var(--shadow-xs)}
.btn-primary:hover{background:var(--primary-800);border-color:var(--primary-800)}
.btn-secondary{background:#fff;color:var(--gray-600);border-color:var(--gray-300);box-shadow:var(--shadow-xs)}
.btn-secondary:hover{background:var(--gray-50)}
.btn-ghost{background:transparent;color:var(--gray-600);border-color:transparent}
.btn-ghost:hover{background:var(--gray-100)}
.btn-link{background:none;border:0;color:var(--primary-700);font-weight:600;font-size:13px;padding:0}
.btn-link:hover{color:var(--primary-800);text-decoration:underline}
.btn-sm{height:32px;padding:0 10px;font-size:13px;border-radius:var(--radius-sm)}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- primitives ---------- */
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs)}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:var(--radius-sm);
  font-size:13px;font-weight:500;border:0;white-space:nowrap;line-height:1}
.tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tag-gray{background:var(--gray-100);color:var(--gray-600)}
.tag-blue{background:var(--primary-50);color:var(--primary-700)}
.tag-green{background:var(--success-50);color:var(--success-700)}
.tag-amber{background:var(--warning-50);color:var(--warning-700)}
.tag-purple{background:var(--purple-50);color:var(--purple-700)}
.tag-red{background:var(--error-50);color:var(--error-700);border-color:var(--error-200)}
.eyebrow{font-size:12px;font-weight:600;color:var(--gray-600)}
.muted{color:var(--gray-500)}
.mono-num{font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--gray-200);border:0;margin:0}

.field-label{display:block;font-size:14px;font-weight:500;color:var(--gray-700);margin-bottom:6px}
.field-hint{font-size:14px;color:var(--gray-600);margin-top:6px}
.input{height:40px;border:1px solid var(--gray-300);border-radius:var(--radius-lg);background:#fff;
  padding:0 12px;font-size:14px;width:100%;box-shadow:var(--shadow-xs)}
.input:focus{outline:0;border-color:var(--primary-600);box-shadow:var(--focus-ring)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--gray-300);border-radius:var(--radius-lg);
  background:#fff;box-shadow:var(--shadow-xs);height:40px;overflow:hidden}
.stepper input{width:64px;border:0;height:100%;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;background:transparent}
.stepper input:focus{outline:0}
.stepper button{width:36px;height:100%;border:0;background:transparent;color:var(--gray-600);font-size:16px;line-height:1}
.stepper button:hover{background:var(--gray-50);color:var(--gray-900)}
/* Unit suffix follows HighRise InputGroup's addon: gray-50 fill, gray-600 text. */
.stepper .unit{padding:0 12px;font-size:14px;color:var(--gray-600);background:var(--gray-50);border-left:1px solid var(--gray-300);height:100%;display:flex;align-items:center}
/* HighRise InputNumber sm — the same 36px as the Select beside it, so the two
   controls in this row sit on one baseline. */
.stepper.sm{height:36px}
.stepper.sm input{width:52px;font-size:14px}
.stepper.sm button{width:32px}

.seg{display:inline-flex;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--gray-600);font-size:14px;font-weight:600;
  height:28px;padding:0 12px;border-radius:var(--radius-md);display:flex;align-items:center;gap:8px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--gray-800);box-shadow:var(--shadow-sm)}
.seg svg{width:18px;height:18px}

.grp-ov{margin-left:auto;display:flex;align-items:center;gap:8px;position:relative}
.tipbtn{width:22px;height:22px;border:0;background:transparent;color:var(--gray-400);border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;padding:0;margin-left:-4px}
.tipbtn svg{width:16px;height:16px}
.tipwrap{position:relative;display:inline-flex}
.tipwrap:hover .tipbtn,.tipbtn:focus-visible{background:var(--gray-100);color:var(--gray-700)}
/* Hover-revealed, per HighRise Popover's hover trigger. Kept in the DOM so it
   can be announced, and bridged with a padded ::before so moving the pointer
   down to the panel doesn't cross a dead gap and dismiss it. */
.tip{position:absolute;top:calc(100% + 8px);right:-8px;z-index:60;width:340px;background:#fff;
  border:1px solid var(--gray-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  padding:0;overflow:hidden;text-align:left;display:block;
  opacity:0;visibility:hidden;transform:translateY(-4px);
  transition:opacity .12s ease,transform .12s ease,visibility .12s}
.tip::before{content:'';position:absolute;top:-10px;left:0;right:0;height:10px}
.tipwrap:hover .tip,.tipwrap:focus-within .tip{opacity:1;visibility:visible;transform:none}
.tip-row{padding:11px 14px;display:flex;flex-direction:column;gap:3px}
.tip-row b{display:block}
.tip-row + .tip-row{border-top:1px solid var(--gray-100)}
.tip-row b{font-size:13px;font-weight:600;color:var(--gray-900)}
.tip-row span{font-size:12px;line-height:17px;color:var(--gray-600)}
.tip-foot{padding:10px 14px;border-top:1px solid var(--gray-200);background:var(--gray-50);
  font-size:12px;line-height:17px;color:var(--gray-500);display:flex;gap:8px;align-items:flex-start}
.tip-foot svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--gray-400)}
.grp-ov .lbl{font-size:12px;color:var(--gray-500);white-space:nowrap}
/* Billing cycle: metadata for every number in the list, so it sits under the
   section title rather than competing with the overage control on the right. */
.sect{display:flex;flex-direction:column;gap:4px;min-width:0}
.sect-t{display:flex;align-items:center;gap:10px}
.cycle{display:flex;align-items:center;gap:6px;font-size:12px;line-height:17px;color:var(--gray-500)}
.cycle svg{width:14px;height:14px;flex:none;color:var(--gray-400)}
.cycle b{font-weight:600;color:var(--gray-700)}

.alert{display:flex;gap:12px;padding:16px;border-radius:var(--radius-lg);border:1px solid;font-size:14px;line-height:20px}
.alert svg{width:20px;height:20px;flex:none;margin-top:1px}
.alert-info{background:var(--primary-25);border-color:var(--primary-300);color:var(--primary-800)}
.alert-warn{background:var(--warning-25);border-color:var(--warning-300);color:var(--warning-700)}
.alert-err{background:var(--error-25);border-color:var(--error-300);color:var(--error-700)}
.alert-ok{background:var(--success-25);border-color:var(--success-300);color:var(--success-700)}

.feat{width:40px;height:40px;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;flex:none}
.feat svg{width:20px;height:20px}
.feat-blue{background:var(--primary-100);color:var(--primary-600)}
.feat-purple{background:var(--purple-100);color:var(--purple-600)}
.feat-green{background:var(--success-100);color:var(--success-600)}
.feat-gray{background:var(--gray-100);color:var(--gray-500)}
.feat-amber{background:var(--warning-100);color:var(--warning-600)}

/* ---------- stepper nav ---------- */
.wizard-steps{display:flex;align-items:center;gap:0;padding:22px 32px;background:#fff;border-bottom:1px solid var(--gray-200)}
.wstep{display:flex;align-items:center;gap:10px;flex:none}
.wstep .num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;border:1.5px solid var(--gray-300);color:var(--gray-500);background:#fff}
.wstep .lbl{font-size:13px;font-weight:600;color:var(--gray-500)}
.wstep.done .num{background:var(--primary-600);border-color:var(--primary-600);color:#fff}
.wstep.done .lbl{color:var(--gray-700)}
.wstep.now .num{background:var(--primary-600);border-color:var(--primary-600);color:#fff;box-shadow:var(--focus-ring)}
.wstep.now .lbl{color:var(--gray-900)}
.wline{flex:1;height:2px;background:var(--gray-200);margin:0 14px;min-width:28px}
.wline.done{background:var(--primary-600)}

/* ---------- layout ---------- */
.page{padding:24px 32px 120px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:20px;align-items:start}
.rail{position:sticky;top:76px;display:flex;flex-direction:column;gap:14px}
.section-title{font-size:16px;font-weight:600;letter-spacing:-.01em}
.section-sub{font-size:13px;color:var(--gray-500);margin-top:3px}

/* ---------- defaults panel ---------- */
.defaults{padding:18px 20px;border-radius:var(--radius-lg);border:1px solid var(--primary-200);
  background:linear-gradient(0deg,var(--primary-25),var(--primary-25));box-shadow:var(--shadow-xs)}
.defaults-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:16px}
.dbox{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:13px 14px}
.radio-row{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.radio-row label{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--gray-700);cursor:pointer}
.radio-row input{margin:2px 0 0;accent-color:var(--primary-600);width:16px;height:16px;flex:none}
.radio-row .rl-desc{display:block;font-size:12px;color:var(--gray-500);margin-top:1px}

/* ---------- product list ---------- */
.list-toolbar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--gray-200);flex-wrap:wrap}
.search{position:relative;flex:1;min-width:200px;max-width:320px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--gray-400)}
.search input{height:36px;padding-left:34px;border-radius:var(--radius-lg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:30px;padding:0 11px;border-radius:var(--radius-full);border:1px solid var(--gray-300);background:#fff;
  font-size:12px;font-weight:600;color:var(--gray-600);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--gray-900);border-color:var(--gray-900);color:#fff}
.chip .n{font-variant-numeric:tabular-nums;opacity:.65}

.grp{border-bottom:1px solid var(--gray-200)}
.grp:last-child{border-bottom:0}
/* The band is the only thing separating one group from the next, so it carries
   both a darker fill and its own rules — gray-50 read as an accident of the row
   striping rather than a divider. */
.grp-head{display:flex;align-items:center;gap:10px;padding:16px;background:var(--gray-200);
  border-top:1px solid var(--gray-300);border-bottom:1px solid var(--gray-300)}
.list-toolbar + .grp .grp-head{border-top:0}
.grp-head .gt{font-size:13px;font-weight:600;color:var(--gray-800)}
.grp-head .gc{font-size:12px;color:var(--gray-500)}
.grp-head .ga{margin-left:auto}

.prow{display:grid;grid-template-columns:minmax(220px,1.05fr) minmax(220px,1.1fr) 264px 32px;
  gap:28px;align-items:center;padding:13px 16px;border-top:1px solid var(--gray-200)}
.grp-head + .prow{border-top:0}
.prow:hover{background:var(--gray-25)}
.prow.is-off .pname,.prow.is-off .pwhat{opacity:.55}
.pname{display:flex;align-items:center;gap:11px;min-width:0}
.pname .nm{font-size:14px;font-weight:600;color:var(--gray-900)}
.pname .mt{font-size:12px;color:var(--gray-500);margin-top:1px}
.pwhat{font-size:13px;color:var(--gray-700);line-height:18px}
.pwhat b{display:block;font-weight:500;color:var(--gray-900)}
.pwhat .sub{display:block;font-size:12px;color:var(--gray-500);margin-top:2px}
.pwhat .money{font-size:12px;color:var(--gray-500);margin-top:2px;display:block;font-variant-numeric:tabular-nums}
.pwhat b{font-weight:600;color:var(--gray-900)}
.pbadge{display:flex;align-items:center;justify-content:flex-end;gap:8px}
/* The disclosure sits in a 32px track but is 28px wide, so left-aligned it
   stopped 4px short of the detail panel's edge below it. Flush right instead. */
.urow .disc,.prow .disc{justify-self:end}
.disc{width:28px;height:28px;border-radius:var(--radius-md);border:1px solid transparent;background:transparent;
  color:var(--gray-400);display:flex;align-items:center;justify-content:center}
.disc:hover{background:var(--gray-100);color:var(--gray-700)}
.disc svg{width:16px;height:16px;transition:transform .12s ease}
.prow.open .disc svg,.urow.open .disc svg{transform:rotate(180deg)}
.pdetail{padding:0 16px 30px 63px;background:var(--gray-25);border-top:1px solid var(--gray-200)}
.pdetail-in{padding-top:26px;display:flex;flex-direction:column;gap:14px}
.meter-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--gray-200)}
.meter-row:last-child{border-bottom:0}
.meter-row .mname{width:190px;font-size:13px;font-weight:500;color:var(--gray-700);flex:none}
.meter-row .mrate{font-size:12px;color:var(--gray-500);font-variant-numeric:tabular-nums;margin-left:auto;text-align:right}
.meter-row .mrate b{display:block;color:var(--gray-900);font-size:13px;font-weight:600}
.override-bar{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--gray-500)}

/* ---------- rail ---------- */
.cost{padding:16px}
.cost .big{font-size:30px;line-height:38px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cost .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:7px 0}
.cost .row + .row{border-top:1px solid var(--gray-200)}
.cost .row .v{font-weight:600;font-variant-numeric:tabular-nums}
.bar{display:flex;height:8px;border-radius:var(--radius-full);overflow:hidden;background:var(--gray-100);margin:12px 0 10px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:7px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gray-600)}
.legend .sw{width:9px;height:9px;border-radius:2px;flex:none}
.legend .n{margin-left:auto;font-weight:600;color:var(--gray-900);font-variant-numeric:tabular-nums}

/* ---------- modal (HighRise Modal / HLModal) ---------- */
.mod{position:fixed;inset:0;z-index:100;background:rgba(16,24,40,.7);
  display:flex;align-items:flex-start;justify-content:center;padding:80px 16px}
.mod-d{width:483px;max-width:100%;background:#fff;border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);
  max-height:calc(100vh - 160px);display:flex;flex-direction:column;overflow:hidden;
  animation:mod-in .14s ease-out}
@keyframes mod-in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.mod-h{padding:20px 24px 0;display:flex;gap:16px;align-items:flex-start}
.mod-t{font-size:16px;font-weight:600;color:var(--gray-900)}
.mod-x{border:0;background:transparent;color:var(--gray-500);padding:0;height:20px;flex:none}
.mod-x svg{width:20px;height:20px}
.mod-x:hover{color:var(--gray-900)}
.mod-b{padding:8px 24px 20px;overflow:auto;font-size:14px;line-height:20px;color:var(--gray-600)}
.mod-b b{color:var(--gray-900);font-weight:600}
.mod-f{padding:16px 24px;border-top:1px solid var(--gray-200);display:flex;gap:12px;justify-content:flex-end}

/* ---------- toast (HighRise Toast / HLNotification) ---------- */
/* Top-right, per the HighRise Toast guidance: a fixed container that stacks a
   queue downward. Bottom-right collided with the save bar and read as a second
   fixed bar rather than a notification. */
.toast-wrap{position:fixed;right:24px;top:24px;z-index:70;display:flex;flex-direction:column;gap:12px}
.toast{display:flex;gap:12px;padding:16px;width:380px;max-width:calc(100vw - 48px);background:#fff;
  border:1px solid var(--gray-200);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);
  animation:toast-in .18s ease-out}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.toast-ic{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.toast-ic svg{width:20px;height:20px}
.toast-ic.success{background:var(--success-100);color:var(--success-600)}
.toast-ic.info{background:var(--primary-100);color:var(--primary-600)}
.toast-b{flex:1;min-width:0}
.toast-t{font-size:14px;font-weight:600;color:var(--gray-900)}
.toast-m{font-size:14px;line-height:20px;color:var(--gray-600);margin-top:2px}
.toast-x{flex:none;border:0;background:transparent;color:var(--gray-400);padding:0;height:20px}
.toast-x svg{width:18px;height:18px}
.toast-x:hover{color:var(--gray-700)}

/* ---------- footer bar ---------- */
.footbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:1px solid var(--gray-200);
  box-shadow:0 -4px 12px #1018280a}
.footbar-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 32px}
.footbar .meta{font-size:13px;color:var(--gray-700);font-weight:500;display:flex;align-items:center;gap:8px}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--warning-500);flex:none}
.savebar-in{display:flex;align-items:center;gap:12px;width:100%;max-width:1180px}
.footbar .sp{margin-left:auto;display:flex;gap:10px}

/* ---------- model cards ---------- */
.models{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.model{position:relative;text-align:left;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-xl);
  padding:20px;box-shadow:var(--shadow-xs);display:flex;flex-direction:column;gap:14px;transition:border-color .12s ease,box-shadow .12s ease}
.model:hover{border-color:var(--primary-300);box-shadow:var(--shadow-sm)}
.model[aria-pressed="true"]{border-color:var(--primary-600);box-shadow:0 0 0 1px var(--primary-600),var(--shadow-sm)}
.model .mhead{display:flex;gap:12px;align-items:flex-start}
.model .mtitle{font-size:16px;font-weight:600;letter-spacing:-.01em}
.model .mdesc{font-size:13px;color:var(--gray-600);margin-top:4px;line-height:19px}
.model .mradio{margin-left:auto;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--gray-300);flex:none;
  display:flex;align-items:center;justify-content:center}
.model[aria-pressed="true"] .mradio{border-color:var(--primary-600);border-width:5px}
.model .mmeta{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:11px 12px;
  display:flex;flex-direction:column;gap:7px}
.model .mmeta .mm{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--gray-600)}
.model .mmeta .mm b{color:var(--gray-900);font-weight:600;text-align:right}
.model .mfit{font-size:12px;color:var(--gray-600);display:flex;gap:7px;align-items:flex-start;line-height:17px}
.model .mfit svg{width:14px;height:14px;color:var(--success-600);flex:none;margin-top:2px}
.model .mgate{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:17px;
  color:var(--warning-700);background:var(--warning-25);border:1px solid var(--warning-200);
  border-radius:var(--radius-lg);padding:9px 11px;margin-top:-4px}
.model .mgate svg{width:14px;height:14px;flex:none;margin-top:1px}

/* ---------- plan cards ---------- */
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.plan{text-align:left;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-xl);
  padding:20px;box-shadow:var(--shadow-xs);display:flex;flex-direction:column;gap:18px;
  transition:border-color .12s ease,box-shadow .12s ease}
.plan:hover{border-color:var(--primary-300);box-shadow:var(--shadow-sm)}
.plan[aria-pressed="true"]{border-color:var(--primary-600);box-shadow:0 0 0 1px var(--primary-600),var(--shadow-sm)}
.plan .ph{display:flex;gap:11px;align-items:flex-start}
.plan .mradio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--gray-300);flex:none;margin-top:2px}
.plan[aria-pressed="true"] .mradio{border-color:var(--primary-600);border-width:5px}
.plan .pt{font-size:16px;font-weight:600;letter-spacing:-.01em}
.plan .pw{font-size:12px;color:var(--gray-500);margin-top:3px;line-height:17px}
.plan .pbig{display:flex;align-items:baseline;gap:10px}
.plan .pbig .n{font-size:40px;line-height:44px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.plan .pbig .l{font-size:12px;color:var(--gray-500);line-height:15px}
.plan .pfacts{border-top:1px solid var(--gray-200);border-bottom:1px solid var(--gray-200);padding:4px 0}
.plan .pfacts div{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font-size:13px;color:var(--gray-600)}
.plan .pfacts div + div{border-top:1px solid var(--gray-100)}
.plan .pfacts b{color:var(--gray-900);font-weight:600;font-variant-numeric:tabular-nums}
.plan .pfoot{font-size:12px;color:var(--gray-500);line-height:17px;margin-top:-4px}

/* ---------- quiet read-only list ---------- */
.qhead{display:flex;align-items:baseline;gap:10px;padding:13px 16px;border-bottom:1px solid var(--gray-200);font-size:14px}
.qhead span{margin-left:auto;font-size:12px;color:var(--gray-500)}
.qrow{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--gray-100);font-size:13px}
.qrow:last-child{border-bottom:0}
.qrow .qn{font-weight:500}
.qrow .qr{margin-left:auto;color:var(--gray-500);font-size:12px;font-variant-numeric:tabular-nums}

/* ---------- expanded row detail ---------- */
/* No width cap: the alert above is a sibling with none, so a cap here makes the
   card beneath stop short of it and the panel reads as two misaligned columns. */
.pd-left{display:flex;flex-direction:column;gap:26px;min-width:0}
.pd-fields{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.pd-rates{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);
  padding:14px 16px;box-shadow:var(--shadow-xs);display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.pd-rates .pd-copy{min-width:0;flex:1}
.pd-rates .btn{flex:none}
.pd-rates .rr{display:flex;align-items:baseline;gap:10px;
  font-size:12px;font-variant-numeric:tabular-nums;color:var(--gray-600)}
.pd-rates .rr b{font-weight:600;color:var(--gray-900);white-space:nowrap}
.pd-rates .rr .ct{color:var(--gray-400)}
.rate-lines{display:flex;flex-direction:column;gap:7px}
.rate-l{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:13px;line-height:18px;color:var(--gray-600)}
.rate-l .rl-k{min-width:140px;color:var(--gray-700);font-weight:500}
.rate-l b{font-weight:600;color:var(--gray-900);font-variant-numeric:tabular-nums}
.rate-l .arr{color:var(--gray-400);padding:0 2px}
.mku{min-width:0}
.field-hint.sm{font-size:12px;line-height:17px;margin-top:6px;max-width:330px}
.stepper.is-off{background:var(--gray-50);border-color:var(--gray-200)}
.stepper.is-off input,.stepper.is-off button,.stepper.is-off .unit{color:var(--gray-400)}
.stepper.is-off button{cursor:not-allowed}
.lnk{border:0;background:none;padding:0;font:inherit;color:var(--primary-700);font-weight:600;text-decoration:none}
.lnk:hover{text-decoration:underline}
.dr-kids{padding:14px 20px 18px;border-top:1px solid var(--gray-200);background:var(--gray-25)}
.dr-kids .k-note{font-size:12px;line-height:17px;color:var(--gray-600);margin-bottom:10px}
.dr-kids .k-list{display:flex;flex-wrap:wrap;gap:6px}
.dr-kids .k-list span{font-size:12px;color:var(--gray-700);background:#fff;border:1px solid var(--gray-300);
  border-radius:var(--radius-md);padding:4px 9px;white-space:nowrap}
@media (max-width:1180px){.pd-grid{grid-template-columns:minmax(0,1fr)}}

/* ---------- items drawer ---------- */
.drawer-mask{position:fixed;inset:0;background:#10182859;z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:#fff;z-index:71;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.dr-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--gray-200)}
.dr-body{flex:1;overflow:auto;padding:8px 20px}
.dr-item{padding:16px 0;border-bottom:1px solid var(--gray-200)}
.dr-item:last-child{border-bottom:0}
.dr-it{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.dr-it .n{font-size:14px;font-weight:600}
.dr-it .u{font-size:12px;color:var(--gray-500);font-variant-numeric:tabular-nums}
.dr-rates{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-top:9px;
  font-size:12px;color:var(--gray-600);font-variant-numeric:tabular-nums}
.dr-rates b{color:var(--gray-900);font-weight:600}
.dr-rates .ct{color:var(--gray-400);white-space:nowrap}
.dr-note{display:flex;gap:9px;margin:14px 20px 0;padding:11px 12px;border-radius:var(--radius-lg);
  background:var(--primary-25);border:1px solid var(--primary-200);color:var(--primary-800);
  font-size:12px;line-height:17px}
.dr-note svg{width:16px;height:16px;flex:none;margin-top:1px}
.dr-foot{display:flex;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid var(--gray-200);background:var(--gray-25)}
.dr-foot .btn{margin-left:auto}


/* "Not applicable" state for a frozen markup: a lock and a dark hover tooltip that says why. */
.na{position:relative;display:flex;width:fit-content;align-items:center;gap:6px;margin-top:8px;font-size:13px;line-height:18px;color:var(--gray-500);cursor:default}
.na svg{width:14px;height:14px;color:var(--gray-400)}
.na:focus-visible{outline:0;box-shadow:var(--focus-ring);border-radius:var(--radius-sm)}
.na-tip{position:absolute;left:0;bottom:calc(100% + 8px);z-index:60;width:max-content;max-width:260px;
  background:var(--gray-900);color:#fff;font-size:13px;line-height:18px;font-weight:500;padding:8px 12px;
  border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);pointer-events:none;
  opacity:0;visibility:hidden;transform:translateY(2px);transition:opacity .12s ease,transform .12s ease,visibility .12s}
.na-tip::after{content:'';position:absolute;top:100%;left:14px;border:6px solid transparent;border-top-color:var(--gray-900)}
.na:hover .na-tip,.na:focus-visible .na-tip{opacity:1;visibility:visible;transform:none}


/* HighRise Switch (36x20) with its state spoken beside it. */
.mk-row{display:flex;align-items:center;gap:12px;min-height:36px}
.sw-t{position:relative;flex:none;width:36px;height:20px;border-radius:var(--radius-full);border:0;padding:0;background:var(--gray-200);transition:background .12s ease}
.sw-t i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:transform .12s ease}
.sw-t.on{background:var(--primary-600)}
.sw-t.on i{transform:translateX(16px)}
.sw-t:focus-visible{outline:0;box-shadow:var(--focus-ring)}
.sw-l{font-size:13px;font-weight:500;color:var(--gray-700)}

/* ---------- HighRise select ---------- */
/* Per the system's Select spec: trigger matches Input; the menu floats with
   shadow-lg, gray-100 row hover and a primary-25 selected row. */
.hrsel{position:relative;display:inline-block}
.hrsel-t{display:flex;align-items:center;gap:8px;height:36px;width:198px;padding:0 8px;
  border:1px solid var(--gray-300);border-radius:var(--radius-md);background:#fff;
  box-shadow:var(--shadow-xs);font-size:14px;font-weight:600;color:var(--gray-900);text-align:left}
.hrsel-t:hover{border-color:var(--primary-600)}
.hrsel-t:focus-visible{outline:0;border-color:var(--primary-600);box-shadow:var(--focus-ring)}
.hrsel-t .hrsel-v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrsel-t svg{width:18px;height:18px;color:var(--gray-500);flex:none;transition:transform .12s ease}
.hrsel-t[aria-expanded="true"]{border-color:var(--primary-600);box-shadow:var(--focus-ring),var(--shadow-xs)}
.hrsel-t[aria-expanded="true"] svg{transform:rotate(180deg)}
.hrsel-t[data-p="included"]{color:var(--primary-800);border-color:var(--primary-200);background:var(--primary-25)}
.hrsel-t[data-p="ppu"]{color:var(--purple-700);border-color:var(--purple-200);background:var(--purple-50)}
.hrsel-t[data-p="covered"]{color:var(--success-700);border-color:var(--success-200);background:var(--success-25)}
.hrsel-t[data-p="off"]{color:var(--gray-600);border-color:var(--gray-300);background:var(--gray-50)}
/* HighRise Select has no size below sm (36px), so the compact variant only
   narrows the trigger; the chrome stays at the DS size. */
.hrsel.sm .hrsel-t{width:160px;font-weight:500;color:var(--gray-700)}
.hrsel-m{position:absolute;z-index:50;top:calc(100% + 6px);left:0;min-width:100%;
  background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);padding:4px;max-height:280px;overflow:auto;
  display:flex;flex-direction:column;gap:2px}
.hrsel-m.right{left:auto;right:0}
.hrsel-m.desc{min-width:360px;max-width:420px}
.hrsel-o{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:8px 10px;
  border:0;background:transparent;border-radius:var(--radius-md);
  font-size:14px;font-weight:500;color:var(--gray-900);text-align:left}
.hrsel-o span{flex:1;white-space:nowrap}
.hrsel-o svg{width:16px;height:16px;color:var(--primary-600);flex:none}
/* Two-line option: the label alone can't say what a billing choice does, so the
   description sits under it and the check pins to the label's line, not the row's
   centre — otherwise it drifts as descriptions wrap. */
.hrsel-o.two{align-items:flex-start;padding:10px 12px;gap:12px}
.hrsel-o.two .ol{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;white-space:normal}
.hrsel-o.two .ol b{font-size:14px;font-weight:500;color:inherit}
.hrsel-o.two .ol i{font-style:normal;font-size:13px;line-height:18px;color:var(--gray-600)}
.hrsel-o.two svg{margin-top:3px}
.hrsel-o:hover{background:var(--gray-100)}
.hrsel-o.on{background:var(--primary-25);color:var(--primary-700);font-weight:500}
.hrsel-o.off{color:var(--gray-400);pointer-events:none}
.hrsel-o.off .ol b,.hrsel-o.off .ol i{color:var(--gray-400)}

/* ---------- plan gate ---------- */
.gate{padding:18px 20px;border-radius:var(--radius-lg);border:1px solid var(--warning-200);
  background:var(--warning-25);box-shadow:var(--shadow-xs)}
.gate-val{display:inline-flex;align-items:baseline;gap:5px;font-size:20px;font-weight:600;
  letter-spacing:-.02em;color:var(--gray-900);background:#fff;border:1px solid var(--gray-200);
  border-radius:var(--radius-lg);padding:7px 12px}
.gate-val span{font-size:12px;font-weight:400;color:var(--gray-500)}

/* ---------- usage tab ---------- */
.statstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;
  border:1px solid var(--gray-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs)}
.statstrip > div{padding:14px 18px}
.statstrip > div + div{border-left:1px solid var(--gray-200)}
.statstrip .v{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.statstrip .s{font-size:12px;color:var(--gray-500);margin-top:2px}

.ubar{height:8px;border-radius:var(--radius-full);background:var(--gray-100);overflow:hidden}
.ubar i{display:block;height:100%;border-radius:var(--radius-full)}
.ubar.ok i{background:var(--primary-600)}
.ubar.warn i{background:var(--warning-600)}
.ubar.full i{background:var(--error-600)}
.uwrap{min-width:0;max-width:360px}
.uwrap .un{display:flex;align-items:baseline;gap:6px;font-size:12px;
  margin-bottom:6px;font-variant-numeric:tabular-nums}
.uwrap .un b{font-weight:600;color:var(--gray-900);font-size:13px}
.uwrap .un span{color:var(--gray-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}


.ucols{display:flex;gap:14px}
.ucol{flex:1;min-width:0}
.ucol .uk{font-size:11px;line-height:15px;color:var(--gray-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.ucol .uv{font-size:13px;line-height:18px;color:var(--gray-400);margin-bottom:5px;font-variant-numeric:tabular-nums}
.ucol .uv b{font-weight:600;color:var(--gray-900)}
.req{border:1px solid var(--warning-200);background:var(--warning-25);border-radius:var(--radius-lg);overflow:hidden}
/* A count alone doesn't say what is being asked for or what it costs to ignore,
   which is the whole reason this banner sits at the top of the page. */
.req .rh{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--warning-200)}
.req .rh svg{width:20px;height:20px;flex:none;color:var(--warning-600);margin-top:1px}
.req .rh-b{flex:1;min-width:0}
.req .rh-b strong{display:block;font-size:14px;color:var(--warning-700)}
.req .rh-s{display:block;font-size:13px;line-height:19px;color:var(--warning-700);opacity:.85;margin-top:2px}
.req .rh-n{flex:none;font-size:12px;color:var(--warning-700);opacity:.75;white-space:nowrap;margin-top:2px}
/* The whole card is the disclosure control; the Review button is its affordance. */
.req .ri{display:flex;gap:14px;align-items:flex-start;padding:15px 16px;background:#fff;border-bottom:1px solid var(--gray-200);cursor:pointer}
.req .ri:hover{background:var(--gray-25)}
.req .ri:focus-visible{outline:0;box-shadow:var(--focus-ring) inset}
/* Open: the header and its box are one card, so no rule between them. */
.req .ri.open{border-bottom:0}
.req .ri:last-child{border-bottom:0}
.req .ri .rt{font-size:14px;font-weight:600}
.req .ri .rs{font-size:12px;color:var(--gray-500);margin-top:3px;line-height:17px}
.req .ri .rimp{font-size:12px;margin-top:8px;padding:7px 10px;border-radius:var(--radius-md);
  background:var(--gray-50);border:1px solid var(--gray-200);color:var(--gray-700);display:inline-block;font-variant-numeric:tabular-nums}
.req .ri .ract{margin-left:auto;flex:none}
.req .ri .ract svg{width:14px;height:14px;transition:transform .12s ease}
.req .ri .ract.btn-brand svg{transform:rotate(180deg)}
.btn-brand{background:#fff;color:var(--primary-700);border-color:var(--primary-300);box-shadow:var(--shadow-xs)}
.btn-brand:hover{background:var(--primary-50)}
.btn-danger{background:#fff;color:var(--error-700);border-color:var(--error-300);box-shadow:var(--shadow-xs)}
.btn-danger:hover{background:var(--error-50)}
.rbox{background:#fff;padding:16px;border-bottom:1px solid var(--gray-200)}
.rb-grid{border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:16px;background:var(--gray-25)}
.rb-row{display:flex;align-items:flex-start;column-gap:32px;row-gap:14px;flex-wrap:wrap}
/* every column is label-over-value with the same 40px value band, so the labels
   line up at the top and the values — text or input — centre on one line */
.rb-f{display:flex;flex-direction:column;min-width:0}
.rb-l{font-size:12px;line-height:16px;color:var(--gray-500);margin-bottom:6px}
.rb-v{min-height:40px;display:flex;align-items:center}
.rb-v b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
/* The note is the client's own words, so it reads as a quotation, not a field
   the agency can edit. It takes the slack so the numbers keep their widths. */
.rb-note{margin-top:14px;padding-top:14px;border-top:1px solid var(--gray-200)}
.rb-note q{display:block;font-size:13px;line-height:19px;color:var(--gray-700);quotes:'\201C' '\201D'}
.rb-none{font-size:13px;color:var(--gray-400)}
.rb-act{margin-left:auto;display:flex;gap:8px;align-items:center;min-height:40px;margin-top:22px}

.bundle{border:1px solid var(--gray-200);border-radius:var(--radius-lg);background:#fff;box-shadow:var(--shadow-xs)}
.bundle + .bundle{margin-top:10px}
.bundle .bhd{display:grid;grid-template-columns:minmax(220px,1.1fr) minmax(200px,1fr) auto auto;gap:14px;align-items:center;padding:13px 16px}
.bundle .bn{font-size:14px;font-weight:600}
.bundle .bmem{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.mini{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--gray-600);
  border:1px solid var(--gray-200);background:var(--gray-50);border-radius:var(--radius-full);padding:2px 8px}


.attn{display:flex;gap:9px;align-items:flex-start;padding:9px 0;font-size:12px;line-height:17px;color:var(--gray-600)}
.attn + .attn{border-top:1px solid var(--gray-200)}
.attn .d{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px}
.attn b{color:var(--gray-900);font-weight:600}

.urow{display:grid;grid-template-columns:300px minmax(0,1fr) 200px 32px;
  gap:44px;align-items:center;padding:13px 16px;border-top:1px solid var(--gray-200)}
@media (max-width:1040px){
  .urow{grid-template-columns:minmax(200px,1fr) minmax(180px,260px) 180px 32px;gap:24px}
}
.grp-head + .urow{border-top:0}
/* The whole row is the disclosure control — the chevron is only its affordance,
   so hover and focus belong to the row and the chevron follows. */
.urow{cursor:pointer}
.urow:hover{background:var(--gray-25)}
.urow:hover .disc{background:var(--gray-100);color:var(--gray-700)}
.urow:focus-visible{outline:0;box-shadow:var(--focus-ring) inset;border-radius:var(--radius-sm)}
.urow.open{background:var(--gray-25)}
.urow.is-off{opacity:.6}

/* ---------- buckets (approach B) ---------- */
.tray{padding:14px 16px;border:1px dashed var(--warning-300);background:var(--warning-25);border-radius:var(--radius-lg)}
.buckets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.bucket{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);overflow:hidden}
.bucket .bh{padding:13px 14px;border-top:3px solid}
.bucket .bt{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.bucket .bt .cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--gray-500);font-variant-numeric:tabular-nums}
.bucket .bd{font-size:12px;color:var(--gray-500);margin-top:4px;line-height:17px}
.bucket .bset{padding:12px 14px;background:var(--gray-25);border-top:1px solid var(--gray-200);border-bottom:1px solid var(--gray-200);
  display:flex;flex-direction:column;gap:9px}
.bucket .bset .sl{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--gray-500)}
.bucket .blist{padding:8px;display:flex;flex-direction:column;gap:5px;min-height:90px}
.pchip{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--gray-200);border-radius:var(--radius-md);
  background:#fff;font-size:13px;font-weight:500}
.pchip .gr{color:var(--gray-300);flex:none;display:flex}
.pchip .gr svg{width:13px;height:13px}
.pchip .pn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .cu{margin-left:auto;font-size:11px;font-weight:600;color:var(--warning-700);background:var(--warning-50);
  border:1px solid var(--warning-200);border-radius:var(--radius-sm);padding:1px 5px;white-space:nowrap}
.pchip .mv{margin-left:auto;width:22px;height:22px;border:0;background:transparent;color:var(--gray-400);border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;flex:none}
.pchip .mv:hover{background:var(--gray-100);color:var(--gray-700)}
.pchip .cu + .mv{margin-left:0}
.bucket .bfoot{padding:9px 14px;border-top:1px solid var(--gray-200);font-size:12px;color:var(--gray-500);
  display:flex;justify-content:space-between}
.bucket .bfoot b{color:var(--gray-900);font-variant-numeric:tabular-nums}

/* ---------- review ---------- */
.diff{display:flex;flex-direction:column}
.diff-row{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--gray-200)}
.diff-row:first-child{border-top:0}
.diff-row .dp{width:190px;font-weight:600;font-size:13px;flex:none}
.diff-row .was{font-size:12px;color:var(--gray-500);text-decoration:line-through}
.diff-row .now{font-size:13px;color:var(--gray-900);font-weight:500}
.diff-row .arr{color:var(--gray-400);font-size:12px}
.sum-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sum{border:1px solid var(--gray-200);border-radius:var(--radius-lg);overflow:hidden;background:#fff}
.sum .sh{padding:11px 14px;border-top:3px solid;display:flex;align-items:center;gap:8px}
.sum .sh .st{font-size:13px;font-weight:600}
.sum .sh .sn{margin-left:auto;font-size:12px;font-weight:600;color:var(--gray-500)}
.sum .sb{padding:4px 0}
.sum .si{display:flex;justify-content:space-between;gap:12px;padding:8px 14px;font-size:13px;border-top:1px solid var(--gray-100)}
.sum .si:first-child{border-top:0}
.sum .si .sv{color:var(--gray-500);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.apply-list{display:flex;flex-direction:column;gap:2px;max-height:196px;overflow:auto;margin-top:8px}
.apply-list label{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:var(--radius-md);font-size:13px;cursor:pointer}
.apply-list label:hover{background:var(--gray-50)}
.apply-list input{accent-color:var(--primary-600);width:16px;height:16px}
.apply-list .sa{margin-left:auto;font-size:11px;color:var(--gray-500)}

/* ---------- notes overlay ---------- */
body.notes-on [data-note]{position:relative;outline:2px solid var(--warning-300);outline-offset:3px;border-radius:var(--radius-md)}
body.notes-on [data-note]::after{content:attr(data-note);position:absolute;z-index:40;right:0;top:-11px;
  transform:translateY(-100%);background:var(--gray-900);color:#fff;font-size:11px;font-weight:500;line-height:15px;
  padding:7px 9px;border-radius:var(--radius-md);max-width:290px;box-shadow:var(--shadow-lg);white-space:pre-line;pointer-events:none}
[data-note]::after{display:none}
body.notes-on [data-note]::after{display:block}

.screen{display:none}
.screen.on{display:block}
@media (max-width:1180px){
  .split{grid-template-columns:minmax(0,1fr)}
  .rail{position:static}
  .models,.buckets,.defaults-grid,.sum-grid{grid-template-columns:minmax(0,1fr)}
  .prow{grid-template-columns:minmax(0,1fr) auto}
  .pwhat{grid-column:1/-1}
}

/* ================= 2A. PLAN BUILDER — policy per product ================= */
/* One short line. Rates and steppers live in the expanded panel, not on every row. */
/* Group header. The only group-level lever is the overage policy: it's the one
   decision that genuinely applies to a whole category, and unlike a bulk "set
   everything" menu it doesn't duplicate what the filter chips already do.
   Groups whose products can't carry a limit have no overage to govern, so they
   get nothing — there is no limit to run past. */
/* One dropdown used everywhere, instead of the OS-native select menu. */
function hrSelect({id, value, options, tone, sm, label, right}){
  const open = S.menu===id;
  const sel = options.find(o=>o.v===value) || options[0];
  options = [...options].sort((a,b)=>(a.d?1:0)-(b.d?1:0));   /* unavailable last */
  return `<div class="hrsel ${sm?'sm':''}">
    <button type="button" class="hrsel-t" ${tone?`data-p="${tone}"`:''} data-menu="${id}"

      <span class="hrsel-v">${sel?sel.l:''}</span>${ic('chev')}

    ${open?`<div class="hrsel-m ${right?'right':''} ${options.some(o=>o.s)?'desc':''}" role="listbox" aria-label="${label}">

          ? `<span class="ol"><b>${o.l}</b><i>${o.s}</i></span>`
          : `<span>${o.l}</span>`}${o.v===value?ic('check'):''}</button>`).join('')}

}

/* Both answers change what the client is billed or told, and neither is undoable

  S.toast = {type, title, msg};
  clearTimeout(toastT);

}
function toastEl(){
  if(!S.toast) return '';

function applyLimit(p, unit, val){
  const i = Math.max(0, p.meters.findIndex(m=>m.k.toLowerCase()===String(unit).toLowerCase()));
  p.over = p.over || {};
  if(!p.over.inc) p.over.inc = p.meters.map(()=>null);
  p.over.inc[i] = val;
}
function dropRequest(id){
  const i = REQUESTS.findIndex(r=>r.id===id);
  if(i>-1) REQUESTS.splice(i,1);
  if(S.req===id) S.req = null;
}

/* HighRise ContentSwitcher. Two mutually exclusive rules read better side by
   side than folded into a menu — both options stay visible, and switching is
   one click instead of three. */
function hrSeg({id, value, options, label}){
  return `<span class="seg" role="group" aria-label="${label}">
    ${options.map(o=>`<button type="button" aria-pressed="${o.v===value}"
      data-seg="${id}|${o.v}">${o.icon?ic(o.icon):''}${o.l}</button>`).join('')}
  </span>`;
}

function groupHead(label, summary){
  return `<div class="grp-head">
    <span class="gt">${label}</span><span class="gc">${summary}</span>
  </div>`;
}

/* The expanded panel is two columns: the controls that act on the left, the
   resulting prices on the right. A pay-per-use product only has one field, so a
   single full-width row left most of the panel empty. */
/* "Outbound SMS" reads as "outbound SMS" mid-sentence, not "outbound sms" —
   only lead-capitalised words get lowercased, acronyms are left alone. */
const sentenceList = ms => { const t = listMeters(ms); return t.charAt(0).toUpperCase()+t.slice(1); };
function listMeters(ms){
  const low = t => /^[A-Z]{2,}/.test(t) ? t : t.charAt(0).toLowerCase()+t.slice(1);
  const n = ms.map(m=>low(m.k));
  return n.length>1 ? n.slice(0,-1).join(', ')+' and '+n[n.length-1] : n[0];
}

/* "Voice calls" prices per call, "Outbound SMS" per SMS, "Executions" per
   execution — the unit noun is the meter's own last word, not its plural unit. */
function unitNoun(m){
  const w = String(m.k).trim().split(/\s+/).pop();
  return /^[A-Z]{2,}$/.test(w) ? w : w.replace(/s$/,'').toLowerCase();
}
/* One line per meter, spelling out both sides of the markup. Covered by agency
   has no markup, so the client side is always $0. */
function ratesCard(p, k){
  const multi = p.meters.length>1, covered = p.policy==='covered';
  return `<div class="pd-rates"><div class="pd-copy">
    <div class="eyebrow" style="margin-bottom:8px">What the client pays</div>
    <div class="rate-lines">${p.meters.map(m=>{
      const u = unitNoun(m);
      return `<div class="rate-l">${multi?`<span class="rl-k">${m.k}</span>`:''}
        <span class="rl-v">Your cost: <b>${money(m.cost)}</b>/${u}
          <span class="arr">&rarr;</span> Client pays: <b>${money(covered?0:m.cost*k)}</b>/${u}</span>
      </div>`;}).join('')}</div>
  </div></div>`;
}
function detailPanel(fields, note, rates){
  return `<div class="pd-left">
    <div class="pd-fields">${fields}</div>
    ${rates}
    ${note}
  </div>`;
}

const metersOf = p => p.meters.map((m,i)=>({...m, used:(USED[p.id]||[])[i]||0, inc:incAt(p,i)}));
const worstMeter = p => metersOf(p).reduce((a,b)=> (b.inc? b.used/b.inc : 0) > (a.inc? a.used/a.inc : 0) ? b : a);
const inBundle = pid => BUNDLES.find(b=>b.members.includes(pid));

function ubar(used, limit){
  const pct = limit ? Math.min(100, Math.round(used/limit*100)) : 0;
  const cls = pct>=100?'full':pct>=80?'warn':'ok';
  return `<div class="ubar ${cls}"><i style="width:${pct}%"></i></div>`;
}
/* One fact per cell. The bar already encodes the ratio, so the percentage is cut;
   the denominator already states the limit, so the state column no longer repeats it;
   "highest of N meters" is a caption about the data, not the data — the expanded row
   shows every meter. Pay per use and Not available have no ceiling, so they stay blank
   rather than printing a number with nothing to measure it against. */
function usageCell(p){
  /* Only a limit makes a usage number meaningful. Products without one get a plain
     label in its place — the column then reads consistently as "how this is metered":
     a bar means there's a ceiling, a tag means there isn't. The tag is not a control;
     the policy is changed in the expanded panel. */
  if(p.policy==='ppu') return '<span class="tag tag-purple" style="justify-self:start">Pay per use</span>';
  if(p.policy!=='included') return '<span></span>';
  const b = inBundle(p.id);
  /* the control now names the pool, so the cell carries only the numbers */
  if(b) return `<div class="uwrap"><div class="un"><b>${b.used} / ${b.total}</b><span>pooled</span></div>
    ${ubar(b.used,b.total)}</div>`;
  /* Every limit gets its own column: name, count, bar. Names are shortened so three fit
     in the cell; the full name stays in the tooltip. */
  return `<div class="uwrap"><div class="ucols">${metersOf(p).map(m=>`<div class="ucol" title="${m.k}">
      <div class="uk">${shortMeter(m)}</div>
      <div class="uv"><b>${m.used}</b> / ${m.inc}</div>
      ${ubar(m.used,m.inc)}</div>`).join('')}</div></div>`;
}
const shortMeter = m => /notifications$/i.test(m.k) ? 'Notifications' : m.k==='Voice calls' ? 'Voice' : m.k==='Outbound SMS' ? 'SMS' : m.k;

/* On the Usage tab the limit is already in the usage cell, so this column carries
   only what isn't said elsewhere: the overage rule, or the markup. */
/* One shape for every row: the value, then when it applies. Both halves name the
   thing — a bare "1.05×" never says what it is a multiple of, or of what. */
function usageState(p){
  const b = inBundle(p.id), k = mk(p);
  const two = (main, sub) => `<b>${main}</b><span class="sub">${sub}</span>`;
  if(b) return two(`${b.markup}× markup`, 'After the shared limit');
  if(p.policy==='included') return onLimit(p)==='charge'
    ? two(`${k}× markup`, 'After the limit')
    : two('Stops at limit', 'Nothing is charged');
  if(p.policy==='ppu') return two(`${k}× markup`, 'From the first use');
  if(p.policy==='covered') return two('You pay', 'Client is never charged');
  return '';
}
function attention(){
  const near=[], atlim=[], unused=[];
  PRODUCTS.filter(p=>p.policy==='included'&&!inBundle(p.id)).forEach(p=>{
    metersOf(p).forEach(m=>{
      const r = m.inc? m.used/m.inc : 0;
      if(r>=1) atlim.push(`${p.name} — ${m.k.toLowerCase()}`);
      else if(r>=.8) near.push(`${p.name} — ${m.k.toLowerCase()}`);
      else if(r<=.1) unused.push(`${p.name} — ${m.k.toLowerCase()}`);
    });
  });
  return {near, atlim, unused};
}

/* Each option says what it does to the client's bill, because the label alone
   doesn't — "Covered by agency" in particular reads as a status, not a decision. */
const USAGE_POLICY = {
  included:{l:'Included in plan', s:'A monthly allowance at no extra charge.'},
  ppu:     {l:'Pay per use',      s:'No allowance. Your markup on each unit used.'},
  covered: {l:'Covered by agency',s:'You pay for it. The client is never charged.'}
};

/* Under "Stop at limit" nothing passes the limit, so a markup on a metered
   product can never apply — the field is frozen rather than quietly ignored.
   Phone system is the exception: its usage-based children bill per use whatever
   the limit does, so the markup stays live and says what it applies to. */
function markupField(p, k){
  if(p.policy==='covered') return '';                       /* the client is never charged */
  const blocked = p.policy==='included' && onLimit(p)==='block';
  const kidsBlocked = blocked && !!p.kids;                  /* usage-based children still bill, so rebilling is the agency's choice */
  const rebillOff = kidsBlocked && p.rebill===false;
  const frozen = (blocked && !p.kids) || rebillOff;
  const stepper = `<span class="stepper sm ${frozen?'is-off':''}">
      <button type="button" ${frozen?'disabled':`data-mku="${p.id}:-1"`} aria-label="Less">−</button>
      <input value="${k}" size="4" readonly ${frozen?'disabled':''}>
      <button type="button" ${frozen?'disabled':`data-mku="${p.id}:1"`} aria-label="More">+</button>
      <span class="unit">× cost</span></span>`;
  const sw = kidsBlocked
    ? `<button type="button" class="sw-t ${rebillOff?'':'on'}" role="switch" aria-checked="${!rebillOff}" data-rebill="${p.id}"
         aria-label="Rebill ${p.kidsLabel}"><i></i></button>`
    : '';
  const hint = (blocked && !p.kids)
    ? `<div class="na" tabindex="0" aria-describedby="na-${p.id}">${ic('lock')}<span>Rebilling not applicable</span>
        <span class="na-tip" id="na-${p.id}" role="tooltip">Usage is blocked at the limit, so there's no overage to rebill.</span></div>`
    : (kidsBlocked
        ? `<div class="field-hint sm">Applies to <button class="lnk" data-drawer="${p.id}">${p.kidsLabel}</button>. ${sentenceList(metersOf(p))} are blocked at their limit.</div>`
        : '');
  const body = kidsBlocked
    ? `<div class="mk-row">${sw}${rebillOff?'<span class="sw-l">Rebilling off</span>':stepper}</div>`
    : (frozen ? '' : `<div class="mk-row">${stepper}</div>`);
  return `<div class="mku"><span class="field-label">Your markup</span>${body}${hint}</div>`;
}

function usageDetail(p){
  const k = mk(p), ms = metersOf(p);
  const canLimit = LIMITABLE.includes(p.id);
  /* No at-limit alert here: the collapsed row directly above already states the
     number, the bar and its colour, so repeating it on expand said nothing new. */

  const fields = `
      <div>
        <span class="field-label">How it's handled</span>
        ${hrSelect({id:'policy:'+p.id, value:p.policy, tone:p.policy,
          label:`How ${p.name} is handled`,
          options:Object.entries(USAGE_POLICY).map(([kk,o])=>{
            const dis = kk==='included' && !canLimit;
            return {v:kk, l:o.l, s:dis?NOT_SUPPORTED:o.s, d:dis};
          })})}
      </div>
      ${p.policy==='included'?`<div>
        <span class="field-label">Free each month</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${ms.map((m,i)=>
          `<span class="stepper sm"><button type="button" data-lim="${p.id}:${i}:-1" aria-label="Less ${m.k}">−</button><input value="${m.inc}" size="4" readonly><button type="button" data-lim="${p.id}:${i}:1" aria-label="More ${m.k}">+</button><span class="unit">${m.unit}</span></span>`).join('')}</div>
      </div>`:''}
      ${markupField(p,k)}`;

  /* Included products are parents — the breakdown belongs in a panel of its own,
     not squeezed into the row. Pay per use has one rate, so it stays inline. */
  const side = p.policy==='included'
    ? `<div class="pd-rates">
        <div class="pd-copy">
          <div class="eyebrow" style="margin-bottom:5px">Usage and rates per item</div>
          <div style="font-size:12px;color:var(--gray-600);line-height:17px">
            See what has been used, what is left and what happens after the limit.</div>
        </div>
        <button class="btn btn-secondary btn-sm" data-drawer="${p.id}">
          See usage and rates ${ic('fwd')}</button>
      </div>`
    : ratesCard(p,k);

  return `<div class="pdetail"><div class="pdetail-in">
    ${detailPanel(fields, '', side)}
  </div></div>`;
}

/* Side panel: the meters behind a parent product. On an included product the client
   pays nothing until an item passes its limit, so the rate is always stated as what
   happens AFTER the allowance — never as a flat per-unit price. */
function itemsDrawer(id){
  const p = PRODUCTS.find(x=>x.id===id); if(!p) return '';
  const k = mk(p), ms = metersOf(p), charges = onLimit(p)==='charge';
  return `<div class="drawer-mask" data-drawer-close="1"></div>
  <aside class="drawer" role="dialog" aria-label="${p.name} items">
    <div class="dr-head">
      <div class="feat feat-${p.g==='ai'?'purple':p.g==='msg'?'blue':'gray'}">${ic(p.icon)}</div>
      <div style="min-width:0"><div style="font-size:16px;font-weight:600;letter-spacing:-.01em">${p.name}</div>
        <div style="font-size:12px;color:var(--gray-500)">${ms.length} item${ms.length>1?'s':''} · included in plan</div></div>
      <button class="disc" data-drawer-close="1" aria-label="Close" style="margin-left:auto">${ic('close')}</button>
    </div>
    <div class="dr-note">${ic('info')}<div>${charges
      ? `<b>Nothing is charged until an item passes its limit.</b> After that, the client pays the rate shown for each extra unit.`
      : `<b>The client is never charged for this.</b> When an item reaches its limit it stops, until you raise the limit.`}</div></div>
    <div class="dr-body">
      ${ms.map(m=>{
        const left = Math.max(0, m.inc - m.used);
        const one = m.unit.replace(/s$/,'');
        const after = charges
          ? (left>0
              ? `<b>${left} ${m.unit} left</b>, then <b>${money(m.cost*k)}</b> per ${one}`
              : `<b>Limit reached</b> — now charging <b>${money(m.cost*k)}</b> per ${one}`)
          : (left>0
              ? `<b>${left} ${m.unit} left</b>, then stops`
              : `<b>Limit reached</b> — stopped`);
        return `<div class="dr-item">
          <div class="dr-it"><span class="n">${m.k}</span><span class="u">${m.used} / ${m.inc} ${m.unit}</span></div>
          ${ubar(m.used,m.inc)}
          <div class="dr-rates">
            <span>${after}</span>
            <span class="ct">Costs you ${money(m.cost)}</span>
          </div>
        </div>`;
      }).join('')}
    </div>
    ${p.kids?`<div class="dr-kids">
      <div class="k-note">Usage-based ${p.kidsLabel.replace(/^other /,'')}. These can't be included in a plan, so the
        client pays your markup on each one — including when the meters above are stopped at their limit.</div>
      <div class="k-list">${p.kids.map(c=>`<span>${c}</span>`).join('')}</div>
    </div>`:''}
    <div class="dr-foot">
      <span style="font-size:12px;color:var(--gray-500)">Close this to change the limits.</span>
      <button class="btn btn-secondary btn-sm" data-drawer-close="1">Close</button>
    </div>
  </aside>`;
}

/* ---- bundle builder ---- */
function scrBundle(){
  const cand = PRODUCTS.filter(p=>LIMITABLE.includes(p.id));
  const chosen = ['phone','email','whatsapp'];
  return `<div class="app">${usageHead()}
  <div class="page">
    <div class="split">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn btn-ghost btn-sm" data-go="usage">${ic('back')} Back to usage</button>
          <div><div class="section-title">Messaging pool</div>
            <div class="section-sub">One shared allowance across several products, instead of a separate wall per product.</div></div>
        </div>

        <div class="card" style="padding:18px 20px" data-note="Why bundles: today a client burns 50 SMS in a week while 50 emails sit unused beside it, and both are a separate conversation with you. A pool absorbs the mix.">
          <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end">
            <div style="flex:1;min-width:220px">
              <span class="field-label">Bundle name</span>
              <input class="input" value="Messaging pool">
            </div>
            <div><span class="field-label">Shared allowance</span>
              <span class="stepper"><button type="button">−</button><input value="500"><button type="button">+</button><span class="unit">units/mo</span></span></div>
            <div><span class="field-label">Markup after the pool</span>
              <span class="stepper"><button type="button">−</button><input value="1.05"><button type="button">+</button><span class="unit">× cost</span></span></div>
          </div>
        </div>

        <div class="card">
          <div class="list-toolbar"><strong style="font-size:13px">Products in this bundle</strong>
            <span class="muted" style="font-size:12px">${chosen.length} of ${cand.length} selected</span></div>
          ${cand.map(p=>{
            const on = chosen.includes(p.id);
            const ms = metersOf(p);
            return `<div class="prow" style="grid-template-columns:auto minmax(200px,1fr) minmax(180px,.9fr) auto">
              <input type="checkbox" ${on?'checked':''} style="width:16px;height:16px;accent-color:var(--primary-600)" aria-label="Include ${p.name}">
              <div class="pname"><div class="feat feat-${p.g==='ai'?'purple':'blue'}">${ic(p.icon)}</div>
                <div><div class="nm">${p.name}</div><div class="mt">${ms.map(m=>m.unit).join(', ')}</div></div></div>
              <div class="pwhat">${on?`<span class="muted">Contributes ${ms.reduce((s,m)=>s+m.used,0)} units this period</span>`:`<span class="muted">Keeps its own ${S.def.inc}/mo limit</span>`}</div>
              <div style="font-size:12px;color:var(--gray-500);font-variant-numeric:tabular-nums">${money(ms.reduce((s,m)=>s+m.cost,0)/ms.length)} avg/unit</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <aside class="rail">
        <div class="card cost">
          <div class="eyebrow">This bundle costs you</div>
          <div class="big">$5.42</div>
          <div style="font-size:12px;color:var(--gray-500);margin:-2px 0 12px">if the client uses all 500 units</div>
          <div class="row"><span class="muted">Client pays</span><span class="v">$5.69</span></div>
          <div class="row"><span class="muted">Your margin</span><span class="v" style="color:var(--success-700)">+$0.27 · 5%</span></div>
        </div>
        <div class="card" style="padding:16px">
          <div class="eyebrow" style="margin-bottom:8px">Compared to separate limits</div>
          <div style="font-size:12px;color:var(--gray-600);line-height:18px">
            Separate: 50 each = 150 units, and this client hit the SMS wall twice while 42 emails went unused.<br><br>
            Pooled: <b style="color:var(--gray-900)">312 of 500 used</b>, no walls hit, and you can see one number instead of three.</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary" style="flex:1" data-go="usage">Cancel</button>
          <button class="btn btn-primary" style="flex:1" data-go="usage">Save bundle</button>
        </div>
      </aside>
    </div>
  </div></div>`;

/* ================= router ================= */
function render(){
  /* Rebuilding the page must not move it: keep the scroll position, and don't replay
     the entrance animation of a modal, toast or drawer that was already on screen. */
  const y = window.scrollY, x = window.scrollX;
  const had = ['.mod-d','.toast','.drawer'].filter(q=>document.querySelector(q));
  const app = document.getElementById('app');
  app.innerHTML = scrUsage();
  had.forEach(q=>{ const el = app.querySelector(q); if(el) el.style.animation = 'none'; });
  window.scrollTo(x, y);
}

document.addEventListener('click', e=>{
  const go = e.target.closest('[data-go]');
  if(go){ S.screen = go.dataset.go; S.open=null; render(); return; }
  const md = e.target.closest('[data-model]');
  if(md){ S.model = md.dataset.model; render(); return; }
  const mn = e.target.closest('[data-menu]');
  if(mn){ S.menu = (S.menu===mn.dataset.menu)?null:mn.dataset.menu; render(); return; }
  const pk = e.target.closest('[data-pick]');
  if(pk){
    const [id,val] = pk.dataset.pick.split('|');
    S.menu = null;
    if(id==='overage'){ S.def.onLimit = val; S.dirty++; }
    else if(id.startsWith('policy:') || id.startsWith('ppu:')){
      const p = PRODUCTS.find(x=>x.id===id.split(':')[1]);
      if(p){ p.policy = val; if(S.screen==='usage') S.dirty++; }
    }
    render(); return;
  }
  if(S.menu && !e.target.closest('.hrsel-m')){ S.menu = null; render(); }
  const lim = e.target.closest('[data-lim]');
  if(lim){
    const [pid,i,d] = lim.dataset.lim.split(':');
    const p = PRODUCTS.find(x=>x.id===pid);
    p.over = p.over || {}; p.over.inc = p.over.inc || p.meters.map((_,j)=>incAt(p,j));
    p.over.inc[i] = Math.max(0, p.over.inc[i] + (+d)*10);
    S.dirty++; render(); return;
  }
  const rb = e.target.closest('[data-rebill]');
  if(rb){ const p = PRODUCTS.find(x=>x.id===rb.dataset.rebill); if(p){ p.rebill = p.rebill===false; S.dirty++; } render(); return; }
  const mku = e.target.closest('[data-mku]');
  if(mku){
    const [pid,d] = mku.dataset.mku.split(':');
    const p = PRODUCTS.find(x=>x.id===pid);
    p.markup = Math.max(1, +((mk(p) + (+d)*0.05).toFixed(2)));
    S.dirty++; render(); return;
  }
  if(e.target.closest('[data-save]') || e.target.closest('[data-discard]')){ S.dirty = 0; render(); return; }
  if(e.target.closest('[data-toast-close]')){ clearTimeout(toastT); S.toast=null; render(); return; }
  /* Approve / Decline only raise the question; the modal commits. */
  const ap = e.target.closest('[data-approve]');
  if(ap){
    const r = REQUESTS.find(x=>x.id===ap.dataset.approve);
    if(r){
      const field = document.querySelector(`[data-newlimit="${r.id}"]`);
      const val = Math.max(1, parseInt(String(field?field.value:r.ask).replace(/[^\d]/g,''),10) || r.ask);
      S.confirm = {kind:'approve', id:r.id, val};
    }
    render(); return;
  }
  const dc = e.target.closest('[data-decline]');
  if(dc){
    if(REQUESTS.some(x=>x.id===dc.dataset.decline)) S.confirm = {kind:'decline', id:dc.dataset.decline};
    render(); return;
  }
  if(e.target.closest('[data-mod-go]')){
    const c = S.confirm; S.confirm = null;
    const r = c && REQUESTS.find(x=>x.id===c.id);
    if(r){
      const p = PRODUCTS.find(x=>x.id===r.pid);
      if(c.kind==='approve'){
        applyLimit(p, r.unit, c.val);
        dropRequest(r.id);
        S.dirty++;
        toast('success','Limit approved',
          `${p.name} is now ${c.val.toLocaleString()} ${r.unit} a month for this client. They will be notified.`);
      } else {
        dropRequest(r.id);
        toast('info','Request declined',
          `${p.name} will stay at ${r.now.toLocaleString()} ${r.unit} a month. The client will be notified and can request again.`);
      }
    }
    render(); return;
  }
  if(S.confirm && e.target.closest('[data-mod-close]')){ S.confirm = null; render(); return; }
  if(S.confirm && e.target.closest('[data-mod-stop]')) return;   /* clicks inside the dialog do nothing else */
  const rq = e.target.closest('[data-req]');
  if(rq){ S.req = (S.req===rq.dataset.req)?null:rq.dataset.req; render(); return; }
  const dw = e.target.closest('[data-drawer]');
  if(dw){ S.drawer = dw.dataset.drawer; render(); return; }
  if(e.target.closest('[data-drawer-close]')){ S.drawer = null; render(); return; }
  const op = e.target.closest('[data-open]');
  if(op){ S.open = (S.open===op.dataset.open)?null:op.dataset.open; render(); return; }
  const sg = e.target.closest('[data-seg]');
  if(sg){
    const [id,val] = sg.dataset.seg.split('|');
    if(id==='overage' && S.def.onLimit!==val){ S.def.onLimit = val; S.dirty++; }
    render(); return;
  }
  const f = e.target.closest('[data-filter]');
  if(f){ S.filter = f.dataset.filter; render(); return; }
  const rs = e.target.closest('[data-reset]');
  if(rs){ const p=PRODUCTS.find(x=>x.id===rs.dataset.reset); if(p){p.markup=null;p.over=null;} render(); return; }
  const d = e.target.closest('[data-def]');
  if(d){
    const v=d.dataset.def;
    if(v==='inc+') S.def.inc+=10; if(v==='inc-') S.def.inc=Math.max(0,S.def.inc-10);
    if(v==='mk+') S.def.markup=+(S.def.markup+0.05).toFixed(2);
    if(v==='mk-') S.def.markup=Math.max(1,+(S.def.markup-0.05).toFixed(2));
    render(); return;
  }
  if(e.target.id==='notesBtn'){
    const on = document.body.classList.toggle('notes-on');
    e.target.setAttribute('aria-pressed', on);
  }
});
/* Keep what is typed in a request's new-limit box across re-renders. */
document.addEventListener('input', e=>{
  const nl = e.target.closest && e.target.closest('[data-newlimit]');
  if(nl){ S.nl = S.nl || {}; S.nl[nl.dataset.newlimit] = nl.value; }
});
document.addEventListener('change', e=>{
  const ps = e.target.closest('[data-policy]');
  if(ps){
    const p=PRODUCTS.find(x=>x.id===ps.dataset.policy); if(!p){ return; }
    /* moving a product in or out of a pool is the same gesture as changing its policy */
    BUNDLES.forEach(x=> x.members = x.members.filter(id=>id!==p.id));
    if(ps.value.startsWith('pool:')){
      const bx = BUNDLES.find(x=>x.id===ps.value.slice(5));
      if(bx) bx.members.push(p.id);
      p.policy='included';
    } else p.policy=ps.value;
    if(S.screen==='usage') S.dirty++;
    render(); return;
  }
  if(e.target.matches('[data-onlimit]')){ S.def.onLimit=e.target.value; render(); return; }
  if(e.target.matches('[data-global-overage]')){ S.def.onLimit=e.target.value; S.dirty++; render(); }
});
/* The row is role="button", so it has to answer Enter and Space like one. */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && S.confirm){ S.confirm = null; render(); return; }
  if(e.key!=='Enter' && e.key!==' ') return;
  const row = e.target.closest('.urow[data-open], .req .ri[data-req]');
  if(!row || row!==e.target) return;
  e.preventDefault();
  if(row.classList.contains('ri')){
    const id = row.dataset.req;
    S.req = (S.req===id) ? null : id;
    render();
    const back = document.querySelector(`.req .ri[data-req="${id}"]`);
    if(back) back.focus();
    return;
  }
  S.open = (S.open===row.dataset.open) ? null : row.dataset.open;
  render();
  const next = document.querySelector(`.urow[data-open="${row.dataset.open}"]`);
  if(next) next.focus();
});
render();
</script>
